name: Materialize Learn Guide 017-032 rollout

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'learn/activate-guides-017-032'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize COPY_LOCKED Network guide runtimes
        run: node scripts/generate-msc-learn-guide-category-runtime.mjs --start=17 --end=32 --write
      - name: Materialize Network preview bindings
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const sectionPath = 'sections/msc-learn-guide.liquid';
          let section = fs.readFileSync(sectionPath, 'utf8');
          const guide016Start = section.indexOf("  {%- when 'MSC-GUIDE-016' -%}");
          if (guide016Start < 0) throw new Error('Guide 016 binding missing');
          const fallbackStart = section.indexOf('  {%- else -%}', guide016Start);
          if (fallbackStart < 0) throw new Error('Guide 016 fallback boundary missing');
          let guide016Block = section.slice(guide016Start, fallbackStart);
          if (!guide016Block.includes('next_active: true')) {
            if (!guide016Block.includes('next_active: false')) throw new Error('Guide 016 next-active state drifted');
            guide016Block = guide016Block.replace(
              '        next_active: false\n',
              "        next_active: true,\n        next_url: '/pages/learn-bitcoin-network?view=msc-learn-guide-017'\n",
            );
          }
          section = section.slice(0, guide016Start) + guide016Block + section.slice(fallbackStart);
          const refreshedFallback = section.indexOf('  {%- else -%}', guide016Start);
          const endcase = section.indexOf('{%- endcase -%}', refreshedFallback);
          if (endcase < 0) throw new Error('Shared guide endcase missing');
          section = section.slice(0, refreshedFallback)
            + "  {%- else -%}\n    {% render 'msc-learn-guide-network-bindings', pilot_registry_id: pilot_registry_id %}\n"
            + section.slice(endcase);
          fs.writeFileSync(sectionPath, section);

          const pad = (value) => String(value).padStart(3, '0');
          const sourceDir = 'docs/learn/content/guides';
          const guideRows = [];
          for (let number = 17; number <= 32; number += 1) {
            const numberText = pad(number);
            const id = `MSC-GUIDE-${numberText}`;
            const matches = fs.readdirSync(sourceDir).filter((file) => file.startsWith(`${id}-`) && file.endsWith('.md'));
            if (matches.length !== 1) throw new Error(`${id} source resolution failed`);
            const source = fs.readFileSync(path.join(sourceDir, matches[0]), 'utf8');
            const title = source.match(/^h1:\s*(.+)$/m)?.[1]?.trim();
            const category = source.match(/^category:\s*(.+)$/m)?.[1]?.trim();
            if (!title || category !== 'The Bitcoin Network') throw new Error(`${id} metadata drifted`);
            const url = `/pages/learn-bitcoin-network?view=msc-learn-guide-${numberText}`;
            guideRows.push([id, title, url]);
            const templatePath = `templates/page.msc-learn-guide-${numberText}.json`;
            fs.writeFileSync(templatePath, `${JSON.stringify({
              sections: { main: { type: 'msc-learn-guide', settings: { registry_id: id } } },
              order: ['main'],
            }, null, 2)}\n`);
          }

          const scope = '.msc-learn-page[data-msc-registry-id="MSC-HUB-NETWORK"]';
          const style = `<style>${scope} .msc-learn-guide-card.is-live-guide{cursor:pointer;transition:border-color .2s ease}${scope} .msc-learn-guide-card.is-live-guide:hover,${scope} .msc-learn-guide-card.is-live-guide:focus-within{border-color:rgba(212,190,153,.82)}.msc-learn-guide-card__link-cover{position:absolute;inset:0;z-index:5;border-radius:inherit;color:inherit;text-decoration:none;outline:none}</style>`;
          const script = `<script>(()=>{const page=document.querySelector('${scope}');if(!page)return;const guides=${JSON.stringify(guideRows)};guides.forEach(([id,title,url])=>{const card=page.querySelector(\`.msc-learn-guide-card[data-msc-guide-id="${'${id}'}"]\`);if(!card||card.querySelector('.msc-learn-guide-card__link-cover'))return;card.removeAttribute('aria-disabled');card.classList.add('is-live-guide');const note=card.querySelector('.msc-learn-preview-note');if(note)note.remove();const link=document.createElement('a');link.href=url;link.className='msc-learn-guide-card__link-cover';link.setAttribute('aria-label',\`Read ${'${title}'}\`);const label=document.createElement('span');label.className='visually-hidden';label.textContent=\`Read ${'${title}'}\`;link.appendChild(label);card.appendChild(link);});})();</script>`;
          const hubPath = 'templates/page.learn-bitcoin-network.json';
          const hub = JSON.parse(fs.readFileSync(hubPath, 'utf8'));
          hub.sections.guidepreviews = {
            type: 'custom-liquid',
            settings: {
              custom_liquid: style + script,
              color_scheme: 'scheme-1',
              padding_top: 0,
              padding_bottom: 0,
            },
          };
          hub.order = ['main', 'guidepreviews'];
          fs.writeFileSync(hubPath, `${JSON.stringify(hub, null, 2)}\n`);

          const lockPath = 'docs/learn/MSC_Learn_Guide_Template_Lock.md';
          let lock = fs.readFileSync(lockPath, 'utf8');
          lock = lock.replace(
            'Guides 002–004 established the first controlled rollout. Guides 005–008 extended the same locked implementation through the `Using Bitcoin` subcategory. Guides 009–012 extended it through the `Security` subcategory. Guides 013–016 extend the same system through `Essentials` and complete the 16-guide Bitcoin Basics category without changing the visual contract.',
            'Guides 002–004 established the first controlled rollout. Guides 005–008 extended the same locked implementation through the `Using Bitcoin` subcategory. Guides 009–012 extended it through the `Security` subcategory. Guides 013–016 completed the 16-guide Bitcoin Basics category through `Essentials`. Guides 017–032 extend the same locked system through all four `The Bitcoin Network` subcategories — `Mining`, `Nodes`, `Network`, and `Consensus` — without changing the visual contract.',
          );
          lock = lock.replace(
            'The Bitcoin Basics hub cards for Guides 001–016 are active in preview. The visible sequence is wired:\n\n`001 → 002 → 003 → 004 → 005 → 006 → 007 → 008 → 009 → 010 → 011 → 012 → 013 → 014 → 015 → 016`\n\nGuide 016 previews Guide 017 — **How Bitcoin Mining Works** — but does not activate it. Guide 017 belongs to the next category rollout, `The Bitcoin Network`.',
            'The Bitcoin Basics hub cards for Guides 001–016 and The Bitcoin Network hub cards for Guides 017–032 are active in preview. The visible sequence is wired continuously through both categories:\n\n`001 → 002 → 003 → 004 → 005 → 006 → 007 → 008 → 009 → 010 → 011 → 012 → 013 → 014 → 015 → 016 → 017 → 018 → 019 → 020 → 021 → 022 → 023 → 024 → 025 → 026 → 027 → 028 → 029 → 030 → 031 → 032`\n\nGuide 016 now continues into Guide 017 on `The Bitcoin Network`. Guide 032 previews Guide 033 — **How the Lightning Network Works** — but does not activate it until the `Building on Bitcoin` rollout exists.',
          );
          const networkViews = Array.from({ length: 16 }, (_, index) => {
            const number = pad(index + 17);
            return `- Guide ${number}: \`?view=msc-learn-guide-${number}\``;
          }).join('\n');
          lock = lock.replace(
            '- Guide 016: `?view=msc-learn-guide-016`\n',
            `- Guide 016: \`?view=msc-learn-guide-016\`\n${networkViews}\n`,
          );
          lock = lock.replace('Guides 001–016 remain preview-bound runtimes', 'Guides 001–032 remain preview-bound runtimes');
          fs.writeFileSync(lockPath, lock);
          NODE
      - name: Commit Network rollout materialization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/learn/MSC_Learn_Guide_Template_Lock.md \
            docs/learn/runtime/MSC-GUIDE-0{17..32}.json \
            sections/msc-learn-guide.liquid \
            snippets/msc-learn-guide-0{17..32}-runtime.liquid \
            templates/page.learn-bitcoin-network.json \
            templates/page.msc-learn-guide-0{17..32}.json
          if git diff --cached --quiet; then
            echo "Network rollout artifacts already committed."
            exit 0
          fi
          git commit -m "Materialize Learn Guides 017-032 Network rollout"
          git push origin HEAD:${{ github.head_ref }}
