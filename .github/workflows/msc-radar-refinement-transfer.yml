name: MSC radar refinement transfer

on:
  push:
    branches:
      - design/homepage-radar-instrument-refinement
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-reviewed-refinement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: design/homepage-radar-instrument-refinement

      - name: Verify authorized base and staging scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base 5c68f9bca2b2fd7314dc3d39afb1d0c66bbb416d HEAD)" = "5c68f9bca2b2fd7314dc3d39afb1d0c66bbb416d"
          actual="$(git diff --name-status 5c68f9bca2b2fd7314dc3d39afb1d0c66bbb416d..HEAD)"
          expected=$'A\t.github/msc-radar-first.patch\nA\t.github/msc-radar-second.patch\nA\t.github/workflows/msc-radar-refinement-transfer.yml'
          test "$actual" = "$expected"

      - name: Apply reviewed radar refinement
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/msc-radar-first.patch
          git apply .github/msc-radar-first.patch
          git apply --check .github/msc-radar-second.patch
          git apply .github/msc-radar-second.patch

      - name: Verify exact implementation scope
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-status 5c68f9bca2b2fd7314dc3d39afb1d0c66bbb416d -- assets/mempool-ui.css assets/msc-home-ecosystem-radar.js sections/msc-home-hero.liquid)"
          expected=$'M\tassets/mempool-ui.css\nM\tassets/msc-home-ecosystem-radar.js\nM\tsections/msc-home-hero.liquid'
          test "$actual" = "$expected"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          npm run test:json
          npm run validate:learn-registry
          npm run validate:learn-library
          npm run test:learn-runtime-contract
          npm run audit:learn-runtime
          node --check assets/msc-home-ecosystem-radar.js
          git diff --check

      - name: Commit reviewed refinement and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/msc-radar-first.patch
          rm .github/msc-radar-second.patch
          rm .github/workflows/msc-radar-refinement-transfer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mempool-ui.css assets/msc-home-ecosystem-radar.js sections/msc-home-hero.liquid .github/msc-radar-first.patch .github/msc-radar-second.patch .github/workflows/msc-radar-refinement-transfer.yml
          git commit -m "Design: refine homepage ecosystem radar instrument"
          git push origin HEAD:design/homepage-radar-instrument-refinement
