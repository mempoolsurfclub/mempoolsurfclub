name: Explore validation

on:
  push:
    branches:
      - explore/atlas-ecosystem-foundation
      - explore/wallets-category-reference
    paths:
      - 'docs/explore/**'
      - 'config/explore/**'
      - 'scripts/explore-runtime/**'
      - 'scripts/explore-category/**'
      - 'assets/msc-explore-runtime.json'
      - 'assets/msc-explore-category.js'
      - 'assets/msc-explore-category.css'
      - 'sections/msc-explore-category.liquid'
      - 'templates/page.explore-category.json'
      - '.github/workflows/explore-validation.yml'
  pull_request:
    paths:
      - 'docs/explore/**'
      - 'config/explore/**'
      - 'scripts/explore-runtime/**'
      - 'scripts/explore-category/**'
      - 'assets/msc-explore-runtime.json'
      - 'assets/msc-explore-category.js'
      - 'assets/msc-explore-category.css'
      - 'sections/msc-explore-category.liquid'
      - 'templates/page.explore-category.json'
      - '.github/workflows/explore-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Explore script syntax
        run: |
          node --check scripts/explore-runtime/build.mjs
          node --check scripts/explore-category/check-wallets-reference.mjs
          node --check assets/msc-explore-category.js

      - name: Build Explore runtime
        run: node scripts/explore-runtime/build.mjs

      - name: Validate generated contract
        run: node scripts/explore-runtime/build.mjs --check

      - name: Validate Wallets category reference
        run: node scripts/explore-category/check-wallets-reference.mjs

      - name: Upload generated contract
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msc-explore-runtime
          if-no-files-found: error
          path: |
            assets/msc-explore-runtime.json
            docs/explore/integration/MSC_Explore_Route_Manifest.json
            docs/explore/integration/MSC_Explore_Validation_Report.json

      - name: Require committed deterministic outputs
        run: |
          git status --porcelain --untracked-files=all -- \
            assets/msc-explore-runtime.json \
            docs/explore/integration/MSC_Explore_Route_Manifest.json \
            docs/explore/integration/MSC_Explore_Validation_Report.json > /tmp/explore-generated-status.txt
          cat /tmp/explore-generated-status.txt
          test ! -s /tmp/explore-generated-status.txt
