name: MSC market API

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  pull_request:
    paths:
      - '.github/workflows/homepage-market-volume.yml'
      - 'scripts/msc-api/**'
      - 'scripts/homepage-market/**'
      - 'assets/msc-home-volume.js'
      - 'sections/msc-home-hero.liquid'

permissions:
  contents: write

concurrency:
  group: msc-market-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build MSC API market snapshots
        env:
          SATFLOW_API_KEY: ${{ secrets.SATFLOW_API_KEY }}
          UNISAT_API_KEY: ${{ secrets.UNISAT_API_KEY }}
        run: node scripts/msc-api/build-market-api.mjs /tmp/msc-api

      - name: Validate MSC API contracts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const manifest = read('/tmp/msc-api/v1/manifest.json');
          const homepage = read('/tmp/msc-api/v1/market/homepage.json');
          const ordinals = read('/tmp/msc-api/v1/market/ordinals.json');
          const runes = read('/tmp/msc-api/v1/market/runes.json');
          if (manifest.schemaVersion !== 1 || manifest.api !== 'MSC API' || manifest.version !== 'v1') process.exit(1);
          if (!['live', 'partial', 'preview'].includes(manifest.mode)) process.exit(1);
          for (const snapshot of [homepage, ordinals, runes]) {
            if (snapshot.schemaVersion !== 1 || snapshot.api !== 'MSC API' || snapshot.version !== 'v1' || snapshot.window !== '24h' || !Array.isArray(snapshot.assets)) process.exit(1);
          }
          if (homepage.mode === 'live') {
            if (homepage.assets.length !== 5) process.exit(1);
          } else if (homepage.mode !== 'preview' || homepage.assets.length !== 0) {
            process.exit(1);
          }
          if (manifest.mode === 'live') {
            if (homepage.mode !== 'live' || ordinals.mode !== 'live' || runes.mode !== 'live') process.exit(1);
          } else if (manifest.mode === 'partial') {
            if (homepage.mode !== 'preview' || ordinals.mode !== 'live' || runes.mode !== 'live') process.exit(1);
          } else {
            if (homepage.mode !== 'preview' || ordinals.mode !== 'preview' || runes.mode !== 'preview') process.exit(1);
            if (ordinals.assets.length || runes.assets.length) process.exit(1);
          }
          NODE

      - name: Publish MSC API data branch
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin homepage-market-data >/dev/null 2>&1; then
            git fetch origin homepage-market-data
            git switch -C homepage-market-data origin/homepage-market-data
          else
            git switch --orphan homepage-market-data
            git rm -rf .
          fi

          rm -rf data/api
          mkdir -p data
          cp -R /tmp/msc-api data/api
          cp /tmp/msc-api/v1/market/homepage.json data/homepage-market.json
          git add data/api data/homepage-market.json

          if git diff --cached --quiet; then
            echo "No MSC API market-data change to publish."
            exit 0
          fi

          git commit -m "Update MSC market API snapshots"
          git push origin homepage-market-data
