name: Homepage market data

on:
  pull_request:
    paths:
      - 'scripts/homepage-market/build-market-data.mjs'
      - '.github/workflows/homepage-market-data.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/homepage-market/build-market-data.mjs'
      - '.github/workflows/homepage-market-data.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: homepage-market-data-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build market snapshot
        run: node scripts/homepage-market/build-market-data.mjs /tmp/homepage-market.json

      - name: Validate snapshot contract
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/homepage-market.json', 'utf8'));
          if (data.schemaVersion !== 1) throw new Error('unexpected schema version');
          if (data.window !== '24h') throw new Error('unexpected volume window');
          if (data.unit !== 'BTC') throw new Error('unexpected volume unit');
          if (data.provider !== 'coingecko') throw new Error('unexpected provider');
          if (data.attribution !== 'Data provided by CoinGecko') throw new Error('missing attribution');
          if (!Number.isFinite(Date.parse(data.generatedAt))) throw new Error('invalid generatedAt');
          if (!Array.isArray(data.assets) || data.assets.length < 5) throw new Error('insufficient assets');
          for (let i = 0; i < data.assets.length; i += 1) {
            const asset = data.assets[i];
            if (asset.rank !== i + 1) throw new Error('invalid rank sequence');
            if (!['ordinal', 'rune', 'brc-20'].includes(asset.type)) throw new Error('invalid asset type');
            if (!asset.name || !Number.isSafeInteger(asset.volumeSats) || asset.volumeSats < 0) throw new Error('invalid asset record');
            if (i > 0 && data.assets[i - 1].volumeSats < asset.volumeSats) throw new Error('assets are not sorted');
          }
          NODE

      - name: Upload validation snapshot
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: homepage-market-data
          path: /tmp/homepage-market.json
          retention-days: 3

      - name: Publish snapshot to data branch
        if: github.event_name != 'pull_request'
        run: |
          git fetch origin homepage-market-data
          git worktree add /tmp/homepage-market-data origin/homepage-market-data
          cd /tmp/homepage-market-data
          git checkout -B homepage-market-data origin/homepage-market-data
          mkdir -p data
          cp /tmp/homepage-market.json data/homepage-market.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/homepage-market.json
          if git diff --cached --quiet; then
            echo "Market snapshot is unchanged."
            exit 0
          fi
          git commit -m "Update homepage market data"
          git push origin HEAD:homepage-market-data
