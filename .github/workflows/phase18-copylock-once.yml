name: Phase 18 temporary runner cleanup

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/phase18-copylock-once.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: phase18-temporary-runner-cleanup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.repository == 'mempoolsurfclub/mempoolsurfclub' &&
      github.event.pull_request.number == 52 &&
      github.event.pull_request.head.ref == 'automation/phase18-copylock-pr-trigger' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Wait for temporary PR closure, then delete only its branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: mempoolsurfclub/mempoolsurfclub
          PR_NUMBER: '52'
          TEMP_REF: heads/automation/phase18-copylock-pr-trigger
        shell: bash
        run: |
          set -euo pipefail

          state=''
          for _ in $(seq 1 40); do
            state="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])')"
            if [ "$state" = 'closed' ]; then
              break
            fi
            sleep 3
          done

          test "$state" = 'closed'

          curl --fail --silent --show-error \
            -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/git/refs/$TEMP_REF"

          status="$(curl --silent --show-error -o /tmp/ref-check.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/git/ref/$TEMP_REF")"
          test "$status" = '404'
