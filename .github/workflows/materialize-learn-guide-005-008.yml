name: Materialize Learn Guide 005-008 rollout

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  materialize:
    if: github.head_ref == 'learn/activate-guides-005-008'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize COPY_LOCKED guide runtimes
        run: node scripts/generate-msc-learn-guide-rollout.mjs --write
      - name: Upload generated Guide 005-008 runtime files
        uses: actions/upload-artifact@v4
        with:
          name: guide-005-008-runtimes
          path: |
            docs/learn/runtime/MSC-GUIDE-005.json
            docs/learn/runtime/MSC-GUIDE-006.json
            docs/learn/runtime/MSC-GUIDE-007.json
            docs/learn/runtime/MSC-GUIDE-008.json
            snippets/msc-learn-guide-005-runtime.liquid
            snippets/msc-learn-guide-006-runtime.liquid
            snippets/msc-learn-guide-007-runtime.liquid
            snippets/msc-learn-guide-008-runtime.liquid
