name: Materialize Learn Guide 005-008 rollout

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'learn/activate-guides-005-008'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize COPY_LOCKED guide runtimes
        run: node scripts/generate-msc-learn-guide-rollout.mjs --write
      - name: Commit generated Guide 005-008 runtime files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/learn/runtime/MSC-GUIDE-005.json \
            docs/learn/runtime/MSC-GUIDE-006.json \
            docs/learn/runtime/MSC-GUIDE-007.json \
            docs/learn/runtime/MSC-GUIDE-008.json \
            snippets/msc-learn-guide-005-runtime.liquid \
            snippets/msc-learn-guide-006-runtime.liquid \
            snippets/msc-learn-guide-007-runtime.liquid \
            snippets/msc-learn-guide-008-runtime.liquid
          if git diff --cached --quiet; then
            echo "Generated runtimes already committed."
            exit 0
          fi
          git commit -m "Materialize Learn Guides 005-008 runtimes"
          git push origin HEAD:${{ github.head_ref }}
