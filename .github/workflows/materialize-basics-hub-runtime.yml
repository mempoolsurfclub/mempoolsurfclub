name: Materialize Bitcoin Basics hub runtime

on:
  push:
    branches:
      - engineering/learn-basics-hub-pilot
    paths:
      - 'scripts/generate-msc-learn-basics-hub-runtime.mjs'
      - 'package.json'
      - '.github/workflows/materialize-basics-hub-runtime.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: engineering/learn-basics-hub-pilot

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate runtime outputs
        run: npm run build:learn-hub-pilot

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/learn/runtime/MSC-HUB-BASICS.json snippets/msc-learn-basics-hub-runtime.liquid
          if git diff --cached --quiet; then
            echo "Generated outputs already synchronized."
            exit 0
          fi
          git commit -m "Generate Bitcoin Basics hub runtime outputs"
          git push
