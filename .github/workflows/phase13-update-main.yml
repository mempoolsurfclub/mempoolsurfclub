name: Phase 13 Update From Main

on:
  push:
    branches:
      - content/learn-innovation-045-048

permissions:
  contents: write

jobs:
  update-from-main:
    if: github.event.head_commit.message == 'Run Phase 13 main update automation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge current main and preserve Phase 13 scope
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          conflicts=$(git diff --name-only --diff-filter=U | sort)
          if [ "$merge_status" -ne 0 ]; then
            if [ "$conflicts" != "docs/learn/content/content-manifest.json" ]; then
              printf 'Unexpected merge conflicts:\n%s\n' "$conflicts"
              exit 1
            fi
          elif [ -n "$conflicts" ]; then
            printf 'Unexpected unresolved conflicts:\n%s\n' "$conflicts"
            exit 1
          fi

          if [ -n "$conflicts" ]; then
            git checkout --theirs docs/learn/content/content-manifest.json
            python - <<'PY'
          from pathlib import Path
          import json

          path = Path('docs/learn/content/content-manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          expected_copy_locked = {
              'MSC-GUIDE-041', 'MSC-GUIDE-042', 'MSC-GUIDE-043', 'MSC-GUIDE-044',
              'MSC-GUIDE-045', 'MSC-GUIDE-046', 'MSC-GUIDE-047', 'MSC-GUIDE-048',
          }
          found = set()
          for item in data:
              guide_id = item.get('registry_id')
              if guide_id in expected_copy_locked:
                  item['status'] = 'COPY_LOCKED'
                  found.add(guide_id)

          missing = expected_copy_locked - found
          if missing:
              raise SystemExit(f'Missing manifest entries: {sorted(missing)}')

          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
            git add docs/learn/content/content-manifest.json
          fi

          rm .github/workflows/phase13-update-main.yml
          git add .github/workflows/phase13-update-main.yml

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            printf 'Unresolved conflicts remain:\n'
            git diff --name-only --diff-filter=U
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          import json

          manifest = json.loads(Path('docs/learn/content/content-manifest.json').read_text(encoding='utf-8'))
          statuses = {item.get('registry_id'): item.get('status') for item in manifest}
          for number in range(41, 49):
              guide_id = f'MSC-GUIDE-{number:03d}'
              if statuses.get(guide_id) != 'COPY_LOCKED':
                  raise SystemExit(f'Unexpected manifest status for {guide_id}: {statuses.get(guide_id)}')

          guides = [
              Path('docs/learn/content/guides/MSC-GUIDE-045-bitvm-bitcoin.md'),
              Path('docs/learn/content/guides/MSC-GUIDE-046-bitcoin-discreet-log-contracts.md'),
              Path('docs/learn/content/guides/MSC-GUIDE-047-bitcoin-op-cat.md'),
              Path('docs/learn/content/guides/MSC-GUIDE-048-emerging-bitcoin-protocols.md'),
          ]
          for guide in guides:
              text = guide.read_text(encoding='utf-8')
              frontmatter = text.split('---', 2)[1]
              if frontmatter.count('status: COPY_LOCKED') != 1:
                  raise SystemExit(f'Unexpected status in {guide}')
              if frontmatter.count('reviewed_date: null') != 1:
                  raise SystemExit(f'Unexpected reviewed_date in {guide}')
              if frontmatter.count('copy_locked_date: 2026-07-24') != 1:
                  raise SystemExit(f'Unexpected copy_locked_date in {guide}')
          PY

          expected=$(cat <<'EOF'
          docs/learn/content/content-manifest.json
          docs/learn/content/guides/MSC-GUIDE-045-bitvm-bitcoin.md
          docs/learn/content/guides/MSC-GUIDE-046-bitcoin-discreet-log-contracts.md
          docs/learn/content/guides/MSC-GUIDE-047-bitcoin-op-cat.md
          docs/learn/content/guides/MSC-GUIDE-048-emerging-bitcoin-protocols.md
          EOF
          )
          actual=$(git diff --cached --name-only origin/main | sort)
          if [ "$actual" != "$(printf '%s\n' "$expected" | sort)" ]; then
            printf 'Unexpected final PR scope relative to main:\n%s\n' "$actual"
            exit 1
          fi

          git diff --cached --check
          git commit -m 'Merge main into Phase 13 innovation branch'
          git push origin HEAD:content/learn-innovation-045-048
