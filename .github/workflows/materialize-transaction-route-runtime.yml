name: Materialize featured transaction route runtime

on:
  push:
    branches:
      - engineering/learn-transaction-route-pilot
    paths:
      - 'scripts/generate-msc-learn-transaction-route-runtime.mjs'
      - 'package.json'
      - '.github/workflows/materialize-transaction-route-runtime.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: engineering/learn-transaction-route-pilot

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate runtime outputs
        run: npm run build:learn-route-pilot

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/learn/runtime/MSC-ROUTE-001.json snippets/msc-learn-transaction-route-runtime.liquid
          if git diff --cached --quiet; then
            echo "Generated outputs already synchronized."
            exit 0
          fi
          git commit -m "Generate featured transaction route runtime outputs"
          git push
