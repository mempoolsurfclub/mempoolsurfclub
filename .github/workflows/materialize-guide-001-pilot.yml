name: Materialize Guide 001 pilot

on:
  push:
    branches:
      - engineering/learn-guide-001-pilot

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pilot branch
        uses: actions/checkout@v4
        with:
          ref: engineering/learn-guide-001-pilot
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Guide 001 runtime artifacts
        run: npm run build:learn-guide-pilot

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/learn/runtime/MSC-GUIDE-001.json snippets/msc-learn-guide-001-runtime.liquid
          if git diff --cached --quiet; then
            echo "Generated artifacts already match."
            exit 0
          fi
          git commit -m "Materialize Guide 001 runtime data [skip ci]"
          git push origin HEAD:engineering/learn-guide-001-pilot
