name: Temporary Learn synchronization correction

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  synchronize:
    if: github.event.pull_request.head.ref == 'content/learn-sync-corrections'
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: content/learn-sync-corrections
          fetch-depth: 0
          persist-credentials: true

      - name: Apply source correction, regenerate, and validate
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse origin/main)" = "620af191e1d17543a3773abc78c57caaf997c065"

          manifest_before="$(sha256sum docs/learn/content/content-manifest.json | awk '{print $1}')"
          guide_before="$(sha256sum snippets/msc-learn-guide-data.liquid | awk '{print $1}')"
          category_before="$(sha256sum snippets/msc-learn-category-data.liquid | awk '{print $1}')"
          path_before="$(sha256sum snippets/msc-learn-path-data.liquid | awk '{print $1}')"
          route_before="$(sha256sum snippets/msc-learn-route-data.liquid | awk '{print $1}')"

          python3 - <<'PY'
          from pathlib import Path
          import json

          registry_path = Path('docs/learn/MSC_Learn_Master_Registry.json')
          registry = registry_path.read_text()
          old = 'The most widely used open-source Bitcoin node and wallet software implementation.'
          new = 'An open-source Bitcoin node implementation and software project.'
          assert registry.count(old) == 1, registry.count(old)
          assert registry.count(new) == 0, registry.count(new)
          registry = registry.replace(old, new)
          json.loads(registry)
          registry_path.write_text(registry)

          checks = [
              ('docs/learn/content/paths/MSC-PATH-START-start-with-bitcoin.md', '### Step 13', 'MSC-ROUTE-001'),
              ('docs/learn/content/paths/MSC-PATH-NETWORK-understand-the-network.md', '### Step 3', 'MSC-ROUTE-001'),
          ]
          for filename, heading, destination in checks:
              text = Path(filename).read_text()
              start = text.index(heading)
              next_step = text.find('\n### Step ', start + len(heading))
              section = text[start:] if next_step == -1 else text[start:next_step]
              assert destination in section
              assert 'Destination status at review: `COPY_LOCKED`' in section
              assert 'Destination status at review: `EDITORIAL_REVIEW`' not in section
          PY

          npm run validate:learn-registry
          npm run build:learn-data
          npm run test:json

          manifest_after="$(sha256sum docs/learn/content/content-manifest.json | awk '{print $1}')"
          guide_after="$(sha256sum snippets/msc-learn-guide-data.liquid | awk '{print $1}')"
          category_after="$(sha256sum snippets/msc-learn-category-data.liquid | awk '{print $1}')"
          path_after="$(sha256sum snippets/msc-learn-path-data.liquid | awk '{print $1}')"
          route_after="$(sha256sum snippets/msc-learn-route-data.liquid | awk '{print $1}')"

          test "$manifest_before" = "$manifest_after"
          test "$guide_before" = "$guide_after"
          test "$category_before" = "$category_after"
          test "$path_before" = "$path_after"
          test "$route_before" = "$route_after"

          python3 - <<'PY'
          from pathlib import Path
          import json

          exact = 'An open-source Bitcoin node implementation and software project.'
          registry = json.loads(Path('docs/learn/MSC_Learn_Master_Registry.json').read_text())
          glossary_record = next(record for record in registry['records'] if record['Registry ID'] == 'MSC-GLOSSARY-001')
          matches = [entry for entry in glossary_record['Initial glossary term map'] if entry['term'] == 'Bitcoin Core']
          assert len(matches) == 1
          assert matches[0]['concise definition'] == exact

          generated = Path('snippets/msc-learn-glossary-data.liquid').read_text()
          assert generated.count(exact) == 1
          assert 'The most widely used open-source Bitcoin node and wallet software implementation.' not in generated
          PY

          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'docs/learn/MSC_Learn_Master_Registry.json' \
            'snippets/msc-learn-glossary-data.liquid' | sort)"
          test "$actual" = "$expected"

          git diff --check
          git rm .github/workflows/learn-sync-corrections-once.yml

          git config user.name 'Mempool Surf Club Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/learn/MSC_Learn_Master_Registry.json snippets/msc-learn-glossary-data.liquid
          git commit -m 'Synchronize Learn route and glossary data'
          git push origin HEAD:content/learn-sync-corrections
