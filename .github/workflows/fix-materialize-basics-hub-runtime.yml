name: Correct Bitcoin Basics hub runtime materialization

on:
  push:
    branches:
      - engineering/learn-basics-hub-pilot
    paths:
      - '.github/workflows/fix-materialize-basics-hub-runtime.yml'

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: engineering/learn-basics-hub-pilot

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preserve every Human Verification note
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/generate-msc-learn-basics-hub-runtime.mjs')
          text = path.read_text()
          old = "line.match(/^\\s{2}-\\s+(.+)$/)?.[1]"
          new = "line.match(/^\\s*-\\s+(.+)$/)?.[1]"
          if old not in text:
              raise SystemExit('Expected parser expression not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npm run build:learn-hub-pilot

      - name: Commit corrected source and outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-msc-learn-basics-hub-runtime.mjs docs/learn/runtime/MSC-HUB-BASICS.json snippets/msc-learn-basics-hub-runtime.liquid
          git commit -m "Preserve complete hub verification notes"
          git push
