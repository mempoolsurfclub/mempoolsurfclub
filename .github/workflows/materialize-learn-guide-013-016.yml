name: Materialize Learn Guide 013-016 rollout

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'learn/activate-guides-013-016'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize COPY_LOCKED guide runtimes
        run: node scripts/generate-msc-learn-guide-rollout.mjs --write
      - name: Commit generated Guide 013-016 runtime files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/learn/runtime/MSC-GUIDE-013.json \
            docs/learn/runtime/MSC-GUIDE-014.json \
            docs/learn/runtime/MSC-GUIDE-015.json \
            docs/learn/runtime/MSC-GUIDE-016.json \
            snippets/msc-learn-guide-013-runtime.liquid \
            snippets/msc-learn-guide-014-runtime.liquid \
            snippets/msc-learn-guide-015-runtime.liquid \
            snippets/msc-learn-guide-016-runtime.liquid
          if git diff --cached --quiet; then
            echo "Generated runtimes already committed."
            exit 0
          fi
          git commit -m "Materialize Learn Guides 013-016 runtimes"
          git push origin HEAD:${{ github.head_ref }}
