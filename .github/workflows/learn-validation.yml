name: Learn validation

on:
  pull_request:
    paths:
      - 'docs/learn/**'
      - 'scripts/**'
      - 'templates/**'
      - 'sections/**'
      - 'snippets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/learn-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/learn/**'
      - 'scripts/**'
      - 'templates/**'
      - 'sections/**'
      - 'snippets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/learn-validation.yml'

permissions:
  contents: write

concurrency:
  group: learn-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  learn-validation:
    name: Learn editorial library
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Apply Stage 1 correction payload
        run: bash scripts/learn-runtime/apply-stage1-correction.sh

      - name: Test Learn runtime contract
        run: npm run test:learn-runtime-contract

      - name: Materialize Learn runtime audit
        run: npm run materialize:learn-runtime-audit

      - name: Audit all 92 Learn runtime packages
        run: npm run audit:learn-runtime

      - name: Commit corrected Stage 1 implementation
        if: github.event_name == 'pull_request'
        run: |
          rm -f scripts/learn-runtime/apply-stage1-correction.sh scripts/learn-runtime/.stage1-patch-*
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            scripts/learn-runtime/apply-stage1-correction.sh \
            scripts/learn-runtime/.stage1-patch-00 \
            scripts/learn-runtime/.stage1-patch-01 \
            scripts/learn-runtime/.stage1-patch-02 \
            scripts/learn-runtime/.stage1-patch-03 \
            scripts/learn-runtime/.stage1-patch-04 \
            scripts/learn-runtime/.stage1-patch-05 \
            scripts/learn-runtime/.stage1-patch-06 \
            scripts/learn-runtime/lib/markdown.mjs \
            scripts/learn-runtime/audit.mjs \
            docs/learn/runtime/schema/msc-learn-runtime-v2.schema.json \
            docs/learn/runtime/reports/package-compatibility.json
          git commit -m 'fix: close Learn runtime security and schema contracts'
          git push origin HEAD:${{ github.head_ref }}
