name: Learn validation

on:
  pull_request:
    paths:
      - 'docs/learn/**'
      - 'scripts/**'
      - 'templates/**'
      - 'sections/**'
      - 'snippets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/learn-validation.yml'
      - '.github/learn-runtime-correction/**'
  push:
    branches:
      - main
    paths:
      - 'docs/learn/**'
      - 'scripts/**'
      - 'templates/**'
      - 'sections/**'
      - 'snippets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/learn-validation.yml'

permissions:
  contents: write

concurrency:
  group: learn-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  learn-validation:
    name: Learn editorial library
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct authorized correction
        run: |
          cat .github/learn-runtime-correction/part-* | base64 --decode > /tmp/learn-runtime-correction.tar.gz
          tar -xzf /tmp/learn-runtime-correction.tar.gz

      - name: Install dependencies deterministically
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test five-role Learn runtime contract
        run: npm run test:learn-runtime-contract

      - name: Materialize and verify deterministic audit
        run: |
          npm run materialize:learn-runtime-audit
          sha256sum docs/learn/runtime/reports/package-compatibility.json > /tmp/learn-runtime-report.sha256
          npm run materialize:learn-runtime-audit
          sha256sum --check /tmp/learn-runtime-report.sha256
          before_mtime="$(stat -c %Y docs/learn/runtime/reports/package-compatibility.json)"
          npm run audit:learn-runtime
          after_mtime="$(stat -c %Y docs/learn/runtime/reports/package-compatibility.json)"
          test "$before_mtime" = "$after_mtime"

      - name: Validate approved Learn registry
        run: npm run validate:learn-registry

      - name: Validate Learn manifest and packages
        run: npm run validate:learn-library

      - name: Validate Guide 001 runtime pilot
        run: npm run validate:learn-guide-pilot

      - name: Validate Bitcoin Basics hub runtime pilot
        run: npm run validate:learn-hub-pilot

      - name: Validate Start With Bitcoin path runtime pilot
        run: npm run validate:learn-path-pilot

      - name: Validate featured transaction route runtime pilot
        run: npm run validate:learn-route-pilot

      - name: Validate Bitcoin Glossary runtime pilot
        run: npm run validate:learn-glossary-pilot

      - name: Verify deterministic Learn-data generation
        run: |
          npm run build:learn-data
          git diff --exit-code -- \
            snippets/msc-learn-guide-data.liquid \
            snippets/msc-learn-category-data.liquid \
            snippets/msc-learn-path-data.liquid \
            snippets/msc-learn-route-data.liquid \
            snippets/msc-learn-glossary-data.liquid

      - name: Parse theme JSON templates
        run: npm run test:json

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit completed Stage 1 contract correction
        run: |
          rm -rf .github/learn-runtime-correction
          npm run materialize:learn-runtime-audit
          npm run audit:learn-runtime
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            .github/learn-runtime-correction \
            .github/workflows/learn-validation.yml \
            docs/learn/runtime/reports/package-compatibility.json \
            docs/learn/runtime/schema/msc-learn-runtime-v2.schema.json \
            package.json \
            package-lock.json \
            scripts/learn-runtime/audit.mjs \
            scripts/learn-runtime/lib/markdown.mjs \
            scripts/learn-runtime/lib/runtime-validation.mjs \
            scripts/learn-runtime/test-contract.mjs
          git diff --cached --check
          git commit -m 'fix: complete Learn runtime Stage 1 contract'
          git push origin HEAD:${{ github.head_ref }}
