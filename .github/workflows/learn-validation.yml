name: Learn validation

on:
  pull_request:
    paths:
      - 'docs/learn/**'
      - 'scripts/**'
      - 'templates/**'
      - 'sections/**'
      - 'snippets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/learn-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/learn/**'
      - 'scripts/**'
      - 'templates/**'
      - 'sections/**'
      - 'snippets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/learn-validation.yml'

permissions:
  contents: write

concurrency:
  group: learn-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  learn-validation:
    name: Learn editorial library
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Test Learn runtime contract
        run: npm run test:learn-runtime-contract

      - name: Materialize Learn runtime audit
        run: npm run materialize:learn-runtime-audit

      - name: Audit all 92 Learn runtime packages
        run: npm run audit:learn-runtime

      - name: Commit regenerated compatibility report
        if: github.event_name == 'pull_request'
        run: |
          report='docs/learn/runtime/reports/package-compatibility.json'
          if ! git diff --quiet -- "$report"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$report"
            git commit -m 'chore: regenerate Learn runtime compatibility report'
            git push origin HEAD:${{ github.head_ref }}
          fi
